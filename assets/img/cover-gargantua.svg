<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4e3c0" stop-opacity="0"/>
      <stop offset="35%" stop-color="#f0d9a8"/>
      <stop offset="50%" stop-color="#fff3d6"/>
      <stop offset="65%" stop-color="#e8c98e"/>
      <stop offset="100%" stop-color="#f4e3c0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#space)"/>
  <g fill="#e8e6df">
    <circle cx="90" cy="80" r="1.3"/><circle cx="700" cy="60" r="1.1"/><circle cx="740" cy="300" r="1.5"/>
    <circle cx="60" cy="300" r="1"/><circle cx="650" cy="180" r="1.2"/><circle cx="150" cy="190" r="1"/>
  </g>
  <!-- 吸积盘（被引力弯折成上下弧） -->
  <ellipse cx="400" cy="200" rx="230" ry="34" fill="none" stroke="url(#disk)" stroke-width="14" opacity="0.9"/>
  <path d="M 240 200 A 160 120 0 0 1 560 200" fill="none" stroke="#f0d9a8" stroke-width="9" opacity="0.65"/>
  <path d="M 250 200 A 150 110 0 0 0 550 200" fill="none" stroke="#d8b46a" stroke-width="7" opacity="0.4"/>
  <!-- 事件视界 -->
  <circle cx="400" cy="200" r="95" fill="#000"/>
  <circle cx="400" cy="200" r="97" fill="none" stroke="#fff3d6" stroke-width="1.5" opacity="0.55"/>
</svg>
